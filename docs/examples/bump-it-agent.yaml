# Copy to ~/.config/leanish/bump-it/agent.yaml and replace the example identity/repo.
repos:
  - repo: acme/widget
    branch: main
agent:
  codingAgent: codex
  model: sol
  effort: medium
  majorEffort: high
# Default Keychain services: leanish-bump-it-write and leanish-bump-it-read.
# Optional overrides; both tools may use the same write/read pair:
# secrets: { write: shared-write, read: shared-read }
commitIdentity:
  name: dependency-bot
  email: dependency-bot@users.noreply.github.com
dirs:
  state: ~/.local/share/leanish/bump-it
  cache: ~/.cache/leanish/bump-it
# Add private folders that must not reach the model, e.g. ~/Documents/private.
readDeny: []
maxNewMajorsPerRun: 3
# Optional, after creating a price table: modelPrices: ~/.config/leanish/model-prices.json
