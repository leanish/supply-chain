name: released-supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily default-branch scan and open-PR rescan
  workflow_dispatch:
    inputs:
      pr:
        description: Rescan only this open PR now
        required: false
        type: string

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/supply-chain/.github/workflows/supply-chain.yml@1dd5ade70486d62d1559f7adb16e2e004628ca5d # v0.1.1
    permissions:
      contents: read
      pull-requests: read
      statuses: write
