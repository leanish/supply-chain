name: supply-chain

# The supply-chain gate, as a reusable workflow. An adopting repository calls it from its own workflow, pinned to a
# full commit SHA of leanish/supply-chain (see packages/ci/README.md, "Adopting the gate"); the gate itself is checked
# out from that same commit (`job.workflow_sha`), so there's one pin.
#
#   pull_request        `compare`: base and head inventories, one advisory snapshot; the `supply-chain` job's result
#                       is the verdict (no write access needed, so fork PRs work too).
#   push to the default branch, schedule
#                       `scan`: every finding fails unless excepted.
#   schedule, workflow_dispatch
#                       also a fresh rescan of every open PR (or the one `pr` input names): its head merged onto its
#                       base's current tip, against that tip; the rescan job posts each verdict as a commit status
#                       named like the required check, on the PR's head. GitHub requires both to pass.
#
# Only the inventory jobs run the repository's own code (Gradle runs the build); they get a read-only token and their
# output is data to the jobs that compare. Credentials that publish never share a job with PR code, and no tool the
# gate runs gets them in its environment.

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version(s) for Gradle builds, as setup-java takes them (one per line; the last one runs Gradle). Empty for no Java.
        type: string
        default: ""
      java-distribution:
        type: string
        default: temurin
      node-version:
        type: string
        default: "24"
      required-check:
        description: The name the `supply-chain` job's check shows as (`<calling job id> / supply-chain`); the daily rescan posts its statuses under it.
        type: string
        default: supply-chain / supply-chain

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sides: ${{ steps.mode.outputs.sides }}
      started: ${{ steps.mode.outputs.started }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT" in
            pull_request) mode=compare; sides='["base","head"]' ;;
            push)
              if [ "$REF" != "$DEFAULT_REF" ]; then echo "::error::supply-chain scans pushes to the default branch only"; exit 1; fi
              mode=scan; sides='["head"]' ;;
            schedule|workflow_dispatch) mode=rescan; sides='["head"]' ;;
            *) echo "::error::supply-chain doesn't handle $EVENT events"; exit 1 ;;
          esac
          { echo "mode=$mode"; echo "sides=$sides"; echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"

  # Daily: the open PRs to rescan (or the one the `pr` input names), each with its base's current tip.
  rescan-plan:
    needs: plan
    if: needs.plan.outputs.mode == 'rescan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - &tool-checkout
        name: Check out the gate at the commit this workflow runs from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tool
          persist-credentials: false
      - &node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - &tool-install
        name: Install the gate's runtime dependencies, without lifecycle scripts
        working-directory: tool
        run: npm ci --ignore-scripts --no-audit --no-fund --omit=dev --workspace packages/ci
      - id: list
        name: List the open PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ONLY: ${{ github.event.inputs.pr }}
        run: |
          node tool/packages/ci/src/cli.ts rescan-plan --github-repo "$REPOSITORY" --out "$RUNNER_TEMP/plan.json" --pr "$ONLY"
          echo "prs=$(cat "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

  # Runs the build's own code: read-only, and its only output is the inventory file.
  inventory:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 2
          persist-credentials: false
      - name: Move to the base the PR builds on
        if: matrix.side == 'base'
        working-directory: repo
        # The checked-out merge commit's first parent.
        run: git checkout --quiet --detach HEAD^1
      - *tool-checkout
      - *node
      - *tool-install
      - &java
        if: inputs.java-version != ''
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - name: Inventory the Gradle builds
        run: node tool/packages/ci/src/cli.ts gradle-inventory --repo repo --out "$RUNNER_TEMP/gradle-${{ matrix.side }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-${{ matrix.side }}
          path: ${{ runner.temp }}/gradle-${{ matrix.side }}.json
          if-no-files-found: ignore
          retention-days: 7

  # The verdict. Required by the adopting repository's ruleset; runs no code from the repository it checks.
  supply-chain:
    needs: [plan, inventory]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require the inventories
        env:
          INVENTORY: ${{ needs.inventory.result }}
        run: |
          if [ "$INVENTORY" != "success" ]; then
            echo "::error::the inventory jobs ended with '$INVENTORY': the gate can't compare without them"
            exit 1
          fi
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 2
          persist-credentials: false
      - *tool-checkout
      - *node
      - *tool-install
      - &osv-scanner
        name: Install the pinned OSV-Scanner
        run: echo "OSV_SCANNER=$(tool/packages/ci/scripts/install-osv-scanner.sh "$RUNNER_TEMP/tools")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gradle-*
          path: ${{ runner.temp }}/inventories
          merge-multiple: true
      - name: Gate dependency changes and findings
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPPLY_CHAIN_COMMIT: ${{ job.workflow_sha }}
          INVENTORIES: ${{ runner.temp }}/inventories
        run: |
          gradle=()
          for side in base head; do
            if [ -f "$INVENTORIES/gradle-$side.json" ]; then gradle+=("--$side-gradle" "$INVENTORIES/gradle-$side.json"); fi
          done
          if [ "$MODE" = "compare" ]; then
            node tool/packages/ci/src/cli.ts compare --repo repo --base HEAD^1 --head HEAD "${gradle[@]}" --report "$RUNNER_TEMP/supply-chain.json"
          else
            node tool/packages/ci/src/cli.ts scan --repo repo --head HEAD "${gradle[@]}" --report "$RUNNER_TEMP/supply-chain.json"
          fi
      - name: Verify registry signatures and provenance attestations
        run: node tool/packages/ci/src/cli.ts npm-signatures --repo repo
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-report
          path: ${{ runner.temp }}/supply-chain.json
          if-no-files-found: ignore

  # Daily, one job per open PR: the Gradle inventories of its base (uploaded before any PR code runs) and of its head
  # merged onto that base (which runs the PR's build). Read-only; its outputs are data to the rescan job.
  rescan-inventory:
    needs: rescan-plan
    if: needs.rescan-plan.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.rescan-plan.outputs.prs) }}
    steps:
      - &rescan-checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - *tool-checkout
      - *node
      - *tool-install
      - *java
      - id: prepare
        name: Merge the PR onto its base
        working-directory: repo
        env:
          NUMBER: ${{ matrix.pr.number }}
          HEAD_SHA: ${{ matrix.pr.head }}
          BASE_SHA: ${{ matrix.pr.base }}
          # For this fetch only (a private repository needs it); the checkout keeps no credentials.
          GIT_FETCH_TOKEN: ${{ github.token }}
        run: ../tool/packages/ci/scripts/prepare-pr.sh "$NUMBER" "$HEAD_SHA" "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Inventory the base
        env:
          BASE: ${{ steps.prepare.outputs.base }}
        run: |
          git -C repo checkout --quiet --detach "$BASE"
          mkdir -p "$RUNNER_TEMP/base"
          node tool/packages/ci/src/cli.ts gradle-inventory --repo repo --out "$RUNNER_TEMP/base/gradle.json"
          touch "$RUNNER_TEMP/base/done"
      - name: Keep the base inventory before the PR's build runs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-inventory-${{ matrix.pr.number }}-base
          path: ${{ runner.temp }}/base
          retention-days: 2
      - name: Inventory the PR as it would land
        env:
          HEAD: ${{ steps.prepare.outputs.head }}
        run: |
          git -C repo checkout --quiet --detach "$HEAD"
          mkdir -p "$RUNNER_TEMP/head"
          node tool/packages/ci/src/cli.ts gradle-inventory --repo repo --out "$RUNNER_TEMP/head/gradle.json"
          touch "$RUNNER_TEMP/head/done"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-inventory-${{ matrix.pr.number }}-head
          path: ${{ runner.temp }}/head
          retention-days: 2

  # Daily: compares every PR as it would land, checks npm signatures, and posts each verdict as a status on the PR's
  # head. The one job with write access; it runs no code from the repository, and its verdicts never leave it.
  rescan:
    needs: [plan, rescan-plan, rescan-inventory]
    if: always() && needs.rescan-plan.result == 'success' && needs.rescan-plan.outputs.prs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - *rescan-checkout
      - *tool-checkout
      - *node
      - *tool-install
      - *osv-scanner
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rescan-inventory-*
          path: ${{ runner.temp }}/inventories
      - name: Rescan and post the verdicts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPPLY_CHAIN_COMMIT: ${{ job.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          PLAN: ${{ needs.rescan-plan.outputs.prs }}
          STARTED: ${{ needs.plan.outputs.started }}
          CONTEXT: ${{ inputs.required-check }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node tool/packages/ci/src/cli.ts rescan --repo repo --github-repo "$REPOSITORY" --plan "$RUNNER_TEMP/plan.json" \
            --inventories "$RUNNER_TEMP/inventories" --reports "$RUNNER_TEMP/reports" --context "$CONTEXT" \
            --started-at "$STARTED" --target-url "$RUN_URL"
      - name: Keep each PR's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
