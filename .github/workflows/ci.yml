name: ci

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what `supply-chain` compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Daily: main's full scan, and a fresh rescan of every open PR.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Rescan only this open PR now (its status lands right away instead of with the daily run)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # The gate on this repository itself, from the code under review: the same reusable workflow adopters call.
  gate:
    uses: ./.github/workflows/supply-chain.yml
    with:
      required-check: supply-chain
    permissions:
      contents: read
      pull-requests: read
      statuses: write

  # Keep the existing required check name; the reusable gate decides its result.
  supply-chain:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "Supply-chain gate passed"

  check:
    needs: supply-chain
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # For the Gradle inventory's coverage test, which runs a real Gradle build.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          SUPPLY_CHAIN_GRADLE_TESTS: "1"
